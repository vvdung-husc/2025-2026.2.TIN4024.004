[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps = 
	tzapu/WiFiManager@^2.0.17
	blynkkk/Blynk@^1.3.2
	adafruit/DHT sensor library@^1.4.7
	witnessmenow/UniversalTelegramBot@^1.3.0
	olikraus/U8g2@^2.36.18
	bblanchon/ArduinoJson@^7.2.2
