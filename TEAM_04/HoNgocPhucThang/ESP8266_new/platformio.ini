[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    blynkkk/Blynk @ ^1.3.2
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    witnessmenow/UniversalTelegramBot @ ^1.1.0
    bblanchon/ArduinoJson @ ^6.21.3