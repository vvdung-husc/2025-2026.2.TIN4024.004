[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    # Thư viện Blynk dành cho ESP32
    blynkkk/Blynk @ ^1.3.2
    
    # Thư viện cảm biến DHT22
    adafruit/DHT sensor library @ ^1.4.6
    
    # Thư viện màn hình OLED SSD1306
    adafruit/Adafruit SSD1306 @ ^2.5.9
    
    # Thư viện đồ họa cho OLED (phụ thuộc của SSD1306)
    adafruit/Adafruit GFX Library @ ^1.11.9
    
    # Thư viện bổ trợ cho cảm biến Adafruit
    adafruit/Adafruit Unified Sensor @ ^1.1.14